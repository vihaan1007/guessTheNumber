<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number game</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <header>
        <h2>
            Guess the number
        </h2>
    </header>
    <main>
        <p id = "p">Enter Number you think is correct</p>
        <br />
        <input id = "g" type = "number" placeholder= "Guess">
        <br />
        <button id = "tA">Try again!</button>
        <button id = "rG">Reset game</button>
        <button id = "oK">OK</button>
        <p id = "a">Press the button</p>
    </main>
    <footer>
        <a href = "rules.html">Rules</a>
        <script src = "script.js"></script>
    </footer>
</body>
</html>
